
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUNKER: ONE MILLION COINS</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #080a0d;
    font-family: Arial, sans-serif;
    color: white;
}

canvas {
    display: block;
}

#ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

#top {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    background: rgba(0,0,0,.7);
    padding: 15px 35px;
    border: 1px solid rgba(255,190,40,.5);
    border-radius: 8px;
}

#top h1 {
    font-size: 22px;
    letter-spacing: 4px;
    color: #ffc83d;
}

#top p {
    font-size: 11px;
    color: #aaa;
    margin-top: 6px;
    letter-spacing: 2px;
}

#counter {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(0,0,0,.75);
    border: 1px solid #b88625;
    border-radius: 8px;
    padding: 15px 20px;
}

#counter small {
    color: #aaa;
    font-size: 11px;
    letter-spacing: 2px;
}

#coins {
    color: #ffd34e;
    font-size: 29px;
    font-weight: bold;
    margin-top: 5px;
}

#bottom {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.75);
    padding: 12px 25px;
    border-radius: 8px;
    color: #ddd;
    font-size: 13px;
}

#crosshair {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 6px;
    height: 6px;
    background: white;
    border-radius: 50%;
    transform: translate(-50%,-50%);
}

#start {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.92);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
    text-align: center;
}

#startBox {
    max-width: 500px;
    padding: 35px;
}

#start h1 {
    font-size: 38px;
    color: #ffca3b;
    letter-spacing: 5px;
}

#start p {
    color: #aaa;
    line-height: 1.8;
    margin: 20px 0;
}

#start button {
    padding: 16px 40px;
    background: linear-gradient(135deg,#ffda60,#b77b12);
    border: none;
    border-radius: 5px;
    color: #241600;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

#loading {
    color: #ffc83d;
    margin-top: 20px;
}
</style>
</head>

<body>

<div id="ui">

    <div id="top">
        <h1>BUNKER</h1>
        <p>ONE MILLION COINS</p>
    </div>

    <div id="counter">
        <small>TOTAL COINS</small>
        <div id="coins">1.000.000</div>
    </div>

    <div id="crosshair"></div>

    <div id="bottom">
        WASD = Laufen &nbsp; | &nbsp; Maus = Umschauen &nbsp; | &nbsp; ESC = Maus lösen
    </div>

</div>

<div id="start">
    <div id="startBox">
        <h1>BUNKER</h1>
        <p>
            Willkommen im Million-Bunker.<br>
            Eine riesige Anlage mit einer Million
            massiven Goldmünzen.<br><br>
            100 Schichten · 10.000 Münzen pro Schicht
        </p>
        <button id="play">BETRETEN</button>
        <div id="loading"></div>
    </div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

import { PointerLockControls } from
'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/PointerLockControls.js';

// ========================================
// KONFIGURATION
// ========================================

const TOTAL_COINS = 1000000;

const COINS_X = 100;
const COINS_Z = 100;
const LAYERS = 100;

const SPACING = 1.65;
const COIN_RADIUS = 0.68;
const COIN_HEIGHT = 0.20;
const LAYER_HEIGHT = 0.24;

const ARENA_WIDTH = COINS_X * SPACING;
const ARENA_DEPTH = COINS_Z * SPACING;

const WALL_HEIGHT = 45;

// ========================================
// SZENE
// ========================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10151b);
scene.fog = new THREE.Fog(0x10151b, 100, 400);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    700
);

camera.position.set(0, 2, 0);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

document.body.appendChild(renderer.domElement);

// ========================================
// LICHT
// ========================================

scene.add(new THREE.AmbientLight(0xffffff, 0.8));

const sun = new THREE.DirectionalLight(0xffe1a0, 3);
sun.position.set(-60, 100, -40);
scene.add(sun);

const goldLight = new THREE.PointLight(0xffbb37, 1500, 180);
goldLight.position.set(0, 30, 0);
scene.add(goldLight);

const ceilingLight = new THREE.PointLight(0xd9e7ff, 900, 140);
ceilingLight.position.set(0, 35, 0);
scene.add(ceilingLight);

// ========================================
// MATERIALIEN
// ========================================

const concreteMaterial = new THREE.MeshStandardMaterial({
    color: 0x343a40,
    roughness: 0.9,
    metalness: 0.1
});

const metalMaterial = new THREE.MeshStandardMaterial({
    color: 0x202a34,
    roughness: 0.45,
    metalness: 0.8
});

const goldMaterial = new THREE.MeshStandardMaterial({
    color: 0xffc21c,
    metalness: 0.85,
    roughness: 0.19
});

const darkGoldMaterial = new THREE.MeshStandardMaterial({
    color: 0xb8790d,
    metalness: 0.8,
    roughness: 0.25
});

// ========================================
// BODEN
// ========================================

const floor = new THREE.Mesh(
    new THREE.BoxGeometry(
        ARENA_WIDTH + 40,
        2,
        ARENA_DEPTH + 40
    ),
    concreteMaterial
);

floor.position.y = -1;
scene.add(floor);

// ========================================
// WÄNDE
// ========================================

function createWall(x, z, width, depth) {

    const wall = new THREE.Mesh(
        new THREE.BoxGeometry(
            width,
            WALL_HEIGHT,
            depth
        ),
        concreteMaterial
    );

    wall.position.set(
        x,
        WALL_HEIGHT / 2,
        z
    );

    scene.add(wall);

    // Metallstreben
    const bars = Math.floor(width / 5);

    if (width > depth) {
        for (let i = 0; i <= bars; i++) {

            const bar = new THREE.Mesh(
                new THREE.BoxGeometry(
                    0.35,
                    WALL_HEIGHT,
                    0.35
                ),
                metalMaterial
            );

            bar.position.set(
                x - width / 2 + i * 5,
                WALL_HEIGHT / 2,
                z
            );

            scene.add(bar);
        }
    } else {
        const barsZ = Math.floor(depth / 5);

        for (let i = 0; i <= barsZ; i++) {

            const bar = new THREE.Mesh(
                new THREE.BoxGeometry(
                    0.35,
                    WALL_HEIGHT,
                    0.35
                ),
                metalMaterial
            );

            bar.position.set(
                x,
                WALL_HEIGHT / 2,
                z - depth / 2 + i * 5
            );

            scene.add(bar);
        }
    }
}

const wallOffset = ARENA_WIDTH / 2 + 5;

createWall(0, -wallOffset, ARENA_WIDTH + 20, 2);
createWall(0, wallOffset, ARENA_WIDTH + 20, 2);
createWall(-wallOffset, 0, 2, ARENA_DEPTH + 20);
createWall(wallOffset, 0, 2, ARENA_DEPTH + 20);

// ========================================
// MÜNZEN
// ========================================

// Eine Münze wird als Geometrie erzeugt.
// InstancedMesh zeichnet eine Million Instanzen.

const coinGeometry = new THREE.CylinderGeometry(
    COIN_RADIUS,
    COIN_RADIUS,
    COIN_HEIGHT,
    20,
    1
);

// Dekorativer Stern auf der Oberseite
const starShape = new THREE.Shape();

for (let i = 0; i < 10; i++) {
    const angle = i * Math.PI / 5 - Math.PI / 2;
    const radius = i % 2 === 0 ? 0.34 : 0.15;

    const x = Math.cos(angle) * radius;
    const y = Math.sin(angle) * radius;

    if (i === 0) {
        starShape.moveTo(x, y);
    } else {
        starShape.lineTo(x, y);
    }
}

starShape.closePath();

const starGeometry = new THREE.ExtrudeGeometry(
    starShape,
    {
        depth: 0.018,
        bevelEnabled: false
    }
);

starGeometry.rotateX(-Math.PI / 2);

const starMaterial = new THREE.MeshStandardMaterial({
    color: 0xffe58a,
    metalness: 0.85,
    roughness: 0.2
});

const dummy = new THREE.Object3D();

const totalPerLayer = COINS_X * COINS_Z;

const coins = new THREE.InstancedMesh(
    coinGeometry,
    goldMaterial,
    TOTAL_COINS
);

coins.instanceMatrix.setUsage(THREE.StaticDrawUsage);

coins.frustumCulled = false;

scene.add(coins);

// Ein gemeinsames Stern-InstancedMesh
const stars = new THREE.InstancedMesh(
    starGeometry,
    starMaterial,
    TOTAL_COINS
);

stars.instanceMatrix.setUsage(THREE.StaticDrawUsage);
stars.frustumCulled = false;
scene.add(stars);

// ========================================
// MILLION COINS ERZEUGEN
// ========================================

let index = 0;

for (let layer = 0; layer < LAYERS; layer++) {

    const layerY = COIN_HEIGHT / 2 + layer * LAYER_HEIGHT;

    for (let x = 0; x < COINS_X; x++) {

        for (let z = 0; z < COINS_Z; z++) {

            const posX =
                (x - (COINS_X - 1) / 2) * SPACING;

            const posZ =
                (z - (COINS_Z - 1) / 2) * SPACING;

            // Münze
            dummy.position.set(
                posX,
                layerY,
                posZ
            );

            dummy.rotation.set(
                0,
                0,
                0
            );

            dummy.updateMatrix();

            coins.setMatrixAt(
                index,
                dummy.matrix
            );

            // Stern
            dummy.position.set(
                posX,
                layerY + COIN_HEIGHT / 2 + 0.015,
                posZ
            );

            dummy.updateMatrix();

            stars.setMatrixAt(
                index,
                dummy.matrix
            );

            index++;
        }
    }

    if (layer % 10 === 0) {
        document.getElementById("loading").textContent =
            "Erzeuge Münzschicht " +
            (layer + 1) + " / " + LAYERS;
    }
}

coins.instanceMatrix.needsUpdate = true;
stars.instanceMatrix.needsUpdate = true;

coins.computeBoundingSphere();
stars.computeBoundingSphere();

// ========================================
// SPIELER
// ========================================

const controls = new PointerLockControls(
    camera,
    document.body
);

const keys = {};

window.addEventListener("keydown", e => {
    keys[e.code] = true;
});

window.addEventListener("keyup", e => {
    keys[e.code] = false;
});

let velocity = new THREE.Vector3();
let direction = new THREE.Vector3();

const playerHeight = 1.8;
const playerSpeed = 18;

const maxX = ARENA_WIDTH / 2 + 2;
const maxZ = ARENA_DEPTH / 2 + 2;

function updatePlayer(delta) {

    if (!controls.isLocked) return;

    direction.set(0, 0, 0);

    if (keys["KeyW"]) direction.z -= 1;
    if (keys["KeyS"]) direction.z += 1;
    if (keys["KeyA"]) direction.x -= 1;
    if (keys["KeyD"]) direction.x += 1;

    direction.normalize();

    velocity.set(0, 0, 0);

    if (direction.lengthSq() > 0) {

        const forward = new THREE.Vector3();
        const right = new THREE.Vector3();

        controls.getDirection(forward);

        forward.y = 0;
        forward.normalize();

        right.crossVectors(forward, camera.up).normalize();

        velocity.addScaledVector(forward, -direction.z);
        velocity.addScaledVector(right, direction.x);

        velocity.normalize();
        velocity.multiplyScalar(playerSpeed * delta);

        controls.getObject().position.add(velocity);
    }

    const p = controls.getObject().position;

    p.x = THREE.MathUtils.clamp(p.x, -maxX, maxX);
    p.z = THREE.MathUtils.clamp(p.z, -maxZ, maxZ);

    // Spieler steht auf dem Boden, nicht auf den Münzen.
    p.y = playerHeight;
}

// ========================================
// START
// ========================================

document.getElementById("play").addEventListener("click", () => {

    controls.lock();

});

controls.addEventListener("lock", () => {
    document.getElementById("start").style.display = "none";
});

controls.addEventListener("unlock", () => {
    document.getElementById("start").style.display = "flex";
});

// ========================================
// RESIZE
// ========================================

window.addEventListener("resize", () => {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});

// ========================================
// GAME LOOP
// ========================================

const clock = new THREE.Clock();

function animate() {

    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.05);

    updatePlayer(delta);

    renderer.render(scene, camera);
}

animate();

console.log("BUNKER: ONE MILLION COINS");
console.log("Erzeugte Münzen:", index);
console.log("Schichten:", LAYERS);
console.log("Münzen pro Schicht:", totalPerLayer);

</script>

</body>
</html>
