
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUNKER - ONE MILLION COINS</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #080a0d;
    font-family: Arial, sans-serif;
    color: white;
}

canvas {
    display: block;
}

#ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

#top {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    background: rgba(0,0,0,.75);
    padding: 15px 35px;
    border: 1px solid #b88625;
    border-radius: 8px;
}

#top h1 {
    font-size: 22px;
    letter-spacing: 4px;
    color: #ffc83d;
}

#top p {
    font-size: 11px;
    color: #aaa;
    margin-top: 6px;
    letter-spacing: 2px;
}

#counter {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(0,0,0,.8);
    border: 1px solid #b88625;
    border-radius: 8px;
    padding: 15px 20px;
}

#counter small {
    color: #aaa;
    font-size: 11px;
    letter-spacing: 2px;
}

#coins {
    color: #ffd34e;
    font-size: 29px;
    font-weight: bold;
    margin-top: 5px;
}

#bottom {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.75);
    padding: 12px 25px;
    border-radius: 8px;
    color: #ddd;
    font-size: 13px;
    white-space: nowrap;
}

#crosshair {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 6px;
    height: 6px;
    background: white;
    border-radius: 50%;
    transform: translate(-50%,-50%);
}

#hint {
    position: absolute;
    left: 50%;
    top: 58%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.8);
    padding: 12px 20px;
    border-radius: 6px;
    font-size: 13px;
    color: #ffd34e;
    text-align: center;
}

#loading {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #080a0d;
    color: #ffd34e;
    z-index: 20;
    font-size: 18px;
}

</style>
</head>

<body>

<div id="loading">BUNKER WIRD GELADEN ...</div>

<div id="ui">

    <div id="top">
        <h1>BUNKER</h1>
        <p>ONE MILLION COINS</p>
    </div>

    <div id="counter">
        <small>TOTAL COINS</small>
        <div id="coins">1.000.000</div>
    </div>

    <div id="crosshair"></div>

    <div id="hint">
        Klicke ins Spiel, um die Maussteuerung zu aktivieren
    </div>

    <div id="bottom">
        WASD = Laufen | Maus = Umschauen | ESC = Maus lösen
    </div>

</div>

<script type="module">

import * as THREE from 'three';

import { PointerLockControls } from
'three/addons/controls/PointerLockControls.js';

import { createCoinField } from './coin.js';

// ========================================
// KONFIGURATION
// ========================================

const WALL_HEIGHT = 45;

const PLAYER_HEIGHT = 1.8;
const PLAYER_RADIUS = 0.32;
const PLAYER_SPEED = 12;

// ========================================
// SZENE
// ========================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x10151b);
scene.fog = new THREE.Fog(0x10151b, 100, 400);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    700
);

// ========================================
// RENDERER
// ========================================

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 1.5)
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

document.body.appendChild(renderer.domElement);

// ========================================
// LICHT
// ========================================

scene.add(
    new THREE.HemisphereLight(
        0xdceaff,
        0x44301b,
        2
    )
);

const sun = new THREE.DirectionalLight(
    0xffe1a0,
    3
);

sun.position.set(-60, 100, -40);
scene.add(sun);

const goldLight = new THREE.PointLight(
    0xffbb37,
    1500,
    180
);

goldLight.position.set(0, 30, 0);
scene.add(goldLight);

const ceilingLight = new THREE.PointLight(
    0xd9e7ff,
    900,
    140
);

ceilingLight.position.set(0, 35, 0);
scene.add(ceilingLight);

// ========================================
// MATERIALIEN
// ========================================

const concreteMaterial = new THREE.MeshStandardMaterial({
    color: 0x343a40,
    roughness: 0.9,
    metalness: 0.1
});

const metalMaterial = new THREE.MeshStandardMaterial({
    color: 0x202a34,
    roughness: 0.45,
    metalness: 0.8
});

// ========================================
// BUNKERBODEN
// ========================================

const floor = new THREE.Mesh(
    new THREE.BoxGeometry(
        210,
        2,
        210
    ),
    concreteMaterial
);

floor.position.y = -1;
scene.add(floor);

// ========================================
// BUNKERWÄNDE
// ========================================

function createWall(x, z, width, depth) {

    const wall = new THREE.Mesh(
        new THREE.BoxGeometry(
            width,
            WALL_HEIGHT,
            depth
        ),
        concreteMaterial
    );

    wall.position.set(
        x,
        WALL_HEIGHT / 2,
        z
    );

    scene.add(wall);

    const bars = Math.floor(
        Math.max(width, depth) / 5
    );

    for (let i = 0; i <= bars; i++) {

        const bar = new THREE.Mesh(
            new THREE.BoxGeometry(
                0.35,
                WALL_HEIGHT,
                0.35
            ),
            metalMaterial
        );

        if (width > depth) {

            bar.position.set(
                x - width / 2 + i * 5,
                WALL_HEIGHT / 2,
                z
            );

        } else {

            bar.position.set(
                x,
                WALL_HEIGHT / 2,
                z - depth / 2 + i * 5
            );

        }

        scene.add(bar);
    }
}

const WALL_OFFSET = 87.5;

createWall(0, -WALL_OFFSET, 185, 2);
createWall(0, WALL_OFFSET, 185, 2);
createWall(-WALL_OFFSET, 0, 2, 185);
createWall(WALL_OFFSET, 0, 2, 185);

// ========================================
// COINS AUS COIN.JS LADEN
// ========================================

const coinField = createCoinField(scene);

const TOP_COIN_Y = coinField.topY;

document.getElementById("coins").textContent =
    coinField.total.toLocaleString("de-DE");

// Spieler startet auf der obersten Münzschicht
camera.position.set(
    0,
    TOP_COIN_Y + PLAYER_HEIGHT,
    0
);

// ========================================
// FIRST PERSON
// ========================================

const controls = new PointerLockControls(
    camera,
    document.body
);

document.addEventListener("click", () => {

    if (!controls.isLocked) {
        controls.lock();
    }

});

controls.addEventListener("lock", () => {
    document.getElementById("hint").style.display = "none";
});

controls.addEventListener("unlock", () => {
    document.getElementById("hint").style.display = "block";
});

// ========================================
// STEUERUNG
// ========================================

const keys = {};

window.addEventListener("keydown", e => {
    keys[e.code] = true;
});

window.addEventListener("keyup", e => {
    keys[e.code] = false;
});

const velocity = new THREE.Vector3();
const direction = new THREE.Vector3();

function updatePlayer(delta) {

    if (!controls.isLocked) return;

    direction.set(0, 0, 0);

    if (keys["KeyW"]) direction.z -= 1;
    if (keys["KeyS"]) direction.z += 1;
    if (keys["KeyA"]) direction.x -= 1;
    if (keys["KeyD"]) direction.x += 1;

    direction.normalize();

    velocity.set(0, 0, 0);

    if (direction.lengthSq() > 0) {

        const forward = new THREE.Vector3();
        const right = new THREE.Vector3();

        controls.getDirection(forward);

        forward.y = 0;
        forward.normalize();

        right.crossVectors(
            forward,
            camera.up
        ).normalize();

        velocity.addScaledVector(
            forward,
            -direction.z
        );

        velocity.addScaledVector(
            right,
            direction.x
        );

        velocity.normalize();
        velocity.multiplyScalar(PLAYER_SPEED * delta);

        const player = controls.getObject();

        const nextX = player.position.x + velocity.x;
        const nextZ = player.position.z + velocity.z;

        // Münz-Hitboxen aus coin.js
        // Der Spieler kann nur dort laufen,
        // wo die obersten Münzen ihn tragen.

        if (
            coinField.canStandAt(
                nextX,
                player.position.z,
                PLAYER_RADIUS
            )
        ) {
            player.position.x = nextX;
        }

        if (
            coinField.canStandAt(
                player.position.x,
                nextZ,
                PLAYER_RADIUS
            )
        ) {
            player.position.z = nextZ;
        }
    }

    // Spieler bleibt auf der obersten Münzschicht
    controls.getObject().position.y =
        TOP_COIN_Y + PLAYER_HEIGHT;
}

// ========================================
// RESIZE
// ========================================

window.addEventListener("resize", () => {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 1.5)
    );
});

// ========================================
// GAME LOOP
// ========================================

const clock = new THREE.Clock();

function animate() {

    requestAnimationFrame(animate);

    const delta = Math.min(
        clock.getDelta(),
        0.05
    );

    updatePlayer(delta);

    renderer.render(scene, camera);
}

animate();

document.getElementById("loading").style.display = "none";

console.log("BUNKER READY");
console.log("TOTAL COINS:", coinField.total);
console.log("COIN MODULE:", "coin.js");
console.log("TOP SURFACE:", TOP_COIN_Y);

</script>
</body>
</html>
